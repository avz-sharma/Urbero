apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: urbero-assistant
  labels:
    cloud.google.com/location: asia-south1
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Mandatory: min-instances=1 ensures zero cold starts during evaluation
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: urbero-service-account@gcp-project.iam.gserviceaccount.com
      containers:
        - image: gcr.io/gcp-project/urbero-assistant:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: GROQ_MODEL
              valueFrom:
                secretKeyRef:
                  name: urbero-groq-model
                  key: latest
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbero-groq-key
                  key: latest
            - name: WAQI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urbero-waqi-token
                  key: latest
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urbero-supabase-url
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: urbero-supabase-key
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
