name: CI Pipeline

on:
  push:
    branches: [main, master, 'refine/**']
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' pip-audit

      - name: Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check backend/

      - name: Mypy Strict Type Check
        run: |
          mypy --strict backend/app

      - name: Pytest Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=90 backend/tests/

      - name: Export schema and audit dependencies
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json
          pip-audit -r requirements.txt

  frontend-lint-test:
    name: Frontend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Compile Check
        run: npm run typecheck

      - name: Unit & A11y Tests
        run: npm run test

      - name: Generated types, build and dependency audit
        run: |
          npx openapi-typescript ../docs/openapi.json -o src/api/generated.ts
          git diff --exit-code -- src/api/generated.ts
          npm run build
          npm audit --audit-level=high

      - name: Chromium interaction and Lighthouse accessibility
        working-directory: .
        env:
          URBERO_AUDIT_TOOLS: ${{ runner.temp }}/urbero-ui
          URBERO_AUDIT_URL: http://127.0.0.1:4173
        run: |
          npm install --prefix "$URBERO_AUDIT_TOOLS" --no-save playwright@1.65.1 lighthouse@13.6.0 chrome-launcher@1.2.3
          "$URBERO_AUDIT_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "$URBERO_AUDIT_URL"; then break; fi
            sleep 1
          done
          node --experimental-strip-types scripts/check-ui.mjs

  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
